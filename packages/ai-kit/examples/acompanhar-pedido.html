<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acompanhar pedido</title>
  <!-- Exemplo de tela gerada só com o kit (o que uma IA no chat produziria seguindo nemo.llm.md).
       Em produção os scripts vêm do CDN; aqui apontam pro dist/ local. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../dist/nemo.js"></script>
  <script src="../dist/nemo-icons.js"></script>
</head>
<body class="bg-secondary text-foreground font-sans">
  <main class="mx-auto flex min-h-screen max-w-[430px] flex-col gap-4 bg-background px-4 pb-32 pt-6">
    <header class="flex items-center gap-3">
      <button aria-label="Voltar" class="inline-flex h-10 w-10 items-center justify-center rounded-md hover:bg-secondary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
        <i data-nemo-icon="arrow-left" class="size-6"></i>
      </button>
      <div>
        <h1 class="font-heading text-xl">Pedido #48213</h1>
        <p class="text-sm text-muted-foreground">Feito hoje às 14:32</p>
      </div>
    </header>

    <!-- Card (receita: rounded-lg border border-border bg-card text-card-foreground shadow-sm) -->
    <section class="rounded-lg border border-border bg-card text-card-foreground shadow-sm">
      <div class="flex flex-col gap-1 p-6">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold leading-tight">Saiu para entrega</h2>
          <!-- Badge color=success variant=filled -->
          <span class="inline-flex items-center whitespace-nowrap border border-transparent font-semibold gap-1 px-2.5 py-0.5 text-xs rounded-full bg-success-soft text-success-soft-foreground">
            <span class="size-1.5 shrink-0 rounded-full bg-current" aria-hidden="true"></span>No prazo
          </span>
        </div>
        <p class="text-sm text-muted-foreground">Chega em 15 min · entregador Carlos</p>
      </div>
      <div class="flex items-center gap-3 p-6 pt-0">
        <i data-nemo-icon="delivery-rider" class="size-6 text-primary-strong"></i>
        <div class="h-2 flex-1 overflow-hidden rounded-full bg-secondary" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso da entrega">
          <div class="h-full w-3/4 bg-primary"></div>
        </div>
      </div>
    </section>

    <section class="rounded-lg border border-border bg-card shadow-sm">
      <h2 class="p-6 pb-2 text-md font-semibold">Itens (3)</h2>
      <ul class="divide-y divide-border">
        <li class="flex items-center justify-between px-6 py-3"><span>Banana prata 1kg</span><span class="text-sm text-muted-foreground">R$ 6,49</span></li>
        <li class="flex items-center justify-between px-6 py-3"><span>Leite integral 1L <span class="ml-1 inline-flex items-center rounded-full border border-transparent bg-destructive px-2 py-0.5 text-2xs font-semibold text-destructive-foreground">-30%</span></span><span class="text-sm text-muted-foreground">R$ 4,19</span></li>
        <li class="flex items-center justify-between px-6 py-3"><span>Pão de forma integral</span><span class="text-sm text-muted-foreground">R$ 9,90</span></li>
      </ul>
      <div class="flex items-center justify-between border-t border-border px-6 py-4">
        <span class="flex items-center gap-2 text-sm"><i data-nemo-icon="payment-pix" class="size-5"></i>Pago com Pix</span>
        <strong>R$ 20,58</strong>
      </div>
    </section>

    <div class="flex gap-2">
      <!-- Button variant=outline / default -->
      <button class="inline-flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-10 px-4 py-2 border border-border bg-background hover:bg-secondary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
        <i data-nemo-icon="order-chat" class="size-5"></i>Ajuda
      </button>
      <button class="inline-flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-10 px-4 py-2 bg-primary text-primary-foreground hover:bg-primary-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
        Pedir novamente
      </button>
    </div>
  </main>

  <!-- NavigationBar (marcação de produção copiada do nemo.llm.md) -->
  <nav aria-label="Navegação principal" class="fixed inset-x-2 bottom-4 mx-auto flex max-w-[414px] items-stretch overflow-hidden rounded-2xl bg-primary drop-shadow-[4px_4px_7.5px_rgba(24,39,75,0.15),-2px_-2px_7.5px_rgba(24,39,75,0.15)]">
    <button type="button" class="flex flex-1 flex-col items-center justify-center gap-1 py-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inverted-foreground focus-visible:ring-offset-2">
      <span aria-hidden="true" class="relative flex size-6 items-center justify-center text-primary-foreground"><i data-nemo-icon="tabbar-home" class="size-6"></i></span>
      <span class="flex flex-col items-center gap-0.5">
        <span class="text-2xs leading-none font-medium text-primary-foreground">Início</span>
      </span>
    </button>
    <button type="button" class="flex flex-1 flex-col items-center justify-center gap-1 py-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inverted-foreground focus-visible:ring-offset-2">
      <span aria-hidden="true" class="relative flex size-6 items-center justify-center text-primary-foreground"><i data-nemo-icon="tabbar-search" class="size-6"></i></span>
      <span class="flex flex-col items-center gap-0.5">
        <span class="text-2xs leading-none font-medium text-primary-foreground">Busca</span>
      </span>
    </button>
    <button type="button" aria-current="page" class="flex flex-1 flex-col items-center justify-center gap-1 py-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inverted-foreground focus-visible:ring-offset-2">
      <span aria-hidden="true" class="relative flex size-6 items-center justify-center text-primary-active"><i data-nemo-icon="tabbar-orders" class="size-6"></i></span>
      <span class="flex flex-col items-center gap-0.5">
        <span class="text-2xs leading-none font-semibold text-primary-active">Pedidos</span>
        <span class="h-px w-2 rounded-full bg-primary-active" aria-hidden="true"></span>
      </span>
    </button>
    <button type="button" class="flex flex-1 flex-col items-center justify-center gap-1 py-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inverted-foreground focus-visible:ring-offset-2">
      <span aria-hidden="true" class="relative flex size-6 items-center justify-center text-primary-foreground"><i data-nemo-icon="tabbar-bag" class="size-6"></i></span>
      <span class="flex flex-col items-center gap-0.5">
        <span class="text-2xs leading-none font-medium text-primary-foreground">Sacola</span>
      </span>
    </button>
  </nav>
</body>
</html>
